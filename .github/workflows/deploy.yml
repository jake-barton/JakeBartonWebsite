name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Build browser games
        run: |
          python3 scripts/build-games.py

      - name: Deploy via FTP to Hostinger
        env:
          FTP_HOST: 157.173.214.227
          FTP_USER: u335085697
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set cmd:fail-exit yes;
            set ftp:ssl-allow yes;
            set ftp:ssl-force no;
            set ssl:verify-certificate no;
            set ftp:passive-mode yes;
            set net:timeout 30;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            open ftp://$FTP_USER:$FTP_PASS@$FTP_HOST;
            cd /domains/jakebartoncreative.com/public_html/;
            put -O . ./_public_html/.htaccess;
            mirror --reverse --verbose ./_public_html/assets/brand/ ./assets/brand/;
            mirror --reverse --verbose ./_public_html/assets/css/ ./assets/css/;
            mirror --reverse --verbose ./_public_html/assets/documents/ ./assets/documents/;
            mirror --reverse --verbose ./_public_html/assets/fonts/ ./assets/fonts/;
            mirror --reverse --verbose ./_public_html/assets/home/ ./assets/home/;
            mirror --reverse --verbose ./_public_html/assets/js/ ./assets/js/;
            mirror --reverse --verbose ./_public_html/assets/lib/ ./assets/lib/;
            mirror --reverse --verbose ./_public_html/assets/source/ ./assets/source/;
            mirror --reverse --verbose ./_public_html/assets/organizations/ ./assets/organizations/;
            mirror --reverse --verbose ./_public_html/assets/project-covers/ ./assets/project-covers/;
            mirror --reverse --verbose ./_public_html/assets/uploads/ ./assets/uploads/;
            mirror --reverse --verbose ./_public_html/assets/work/ ./assets/work/;
            mirror --reverse --verbose ./_public_html/assets/reel/ ./assets/reel/;
            mirror --reverse --verbose ./_public_html/games/mario-kart/ ./games/mario-kart/;
            mirror --reverse --verbose ./_public_html/includes/ ./includes/;
            mirror --reverse --verbose ./_public_html/work/ ./work/;
            put -O . ./_public_html/index.php ./_public_html/home.php ./_public_html/router.php ./_public_html/contact-handler.php;
            rm -rf ./work/minnies-golf ./work/wrappt ./work/river ./work/barton-enterprises ./work/campusconnect ./work/psengine ./work/macbook-golf-simulator ./work/october-assistant ./work/artist-campaigns ./work/banking-concurrency-lab ./work/campaign-design;
            rm -rf ./assets/work/minnies-golf;
            rm -f ./assets/organizations/minnies.svg ./assets/source/minnies-score.txt;
            rm -rf ./studio;
            rm -rf ./includes/cms-components;
            rm -f ./includes/cms.php ./includes/work-detail-page.php ./includes/project-blueprint.json ./includes/work-easter-eggs.php;
            rm -f ./assets/css/studio.css ./assets/js/studio.js ./assets/js/studio-preview-bridge.js;
            rm -rf ../storage/cms;
            bye
          "
